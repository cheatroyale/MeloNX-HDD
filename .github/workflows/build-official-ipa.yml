name: Build official MeloNX IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  OFFICIAL_SOURCE: https://starforgejo.dev/projects/MeloNX.git
  OFFICIAL_REVISION: 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
  LIBHAC_SOURCE: https://starforgejo.dev/archive/LibHac_Ryubing.git
  LIBHAC_REVISION: 23e402ebb6dedc517e34a98a033078dc0f6fd478
  LIBHAC_PACKAGE: Ryujinx.LibHac
  LIBHAC_VERSION: 0.21.0-alpha.129

jobs:
  build-ipa:
    name: Build official MeloNX (unsigned)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned official source
        run: |
          git clone --depth 1 --branch master "$OFFICIAL_SOURCE" source
          test "$(git -C source rev-parse HEAD)" = "$OFFICIAL_REVISION"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Make dotnet visible to Xcode
        run: sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Select current Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Reconstruct the unavailable LibHac package from its pinned source
        run: |
          git clone "$LIBHAC_SOURCE" libhac
          git -C libhac checkout --detach "$LIBHAC_REVISION"
          test -z "$(git -C libhac status --porcelain)"
          grep -Fq '<PackageId>Ryujinx.LibHac</PackageId>' libhac/src/LibHac/LibHac.csproj
          grep -Fq 'TitleBlock' libhac/src/LibHac/Ns/ApplicationControlProperty.cs
          (
            cd libhac
            dotnet run --project build/_build.csproj -- --target Codegen
            dotnet run --project build/CodeGen/_buildCodeGen.csproj
            dotnet test tests/LibHac.Tests/LibHac.Tests.csproj -c Release --filter 'FullyQualifiedName~LibHac.Tests.Ns.TypeLayoutTests'
            dotnet pack src/LibHac/LibHac.csproj -c Release -o ../source/local-libhac-feed \
              -p:PackageVersion="$LIBHAC_VERSION" \
              -p:Version="$LIBHAC_VERSION" \
              -p:InformationalVersion="$LIBHAC_VERSION+source.$LIBHAC_REVISION"
          )
          test -f "source/local-libhac-feed/$LIBHAC_PACKAGE.$LIBHAC_VERSION.nupkg"
          perl -0pi -e "s#https://starforgejo.dev/api/packages/Ryulynx/nuget/index\\.json#$PWD/source/local-libhac-feed#" source/nuget.config
          grep -Fq "$PWD/source/local-libhac-feed" source/nuget.config

      - name: Build the official native core outside Xcode
        run: |
          (
            cd source
            bash distribution/ios/build.sh
          )
          test -f source/src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib

      - name: Avoid the Xcode 26 legacy-target crash
        run: |
          PROJECT=source/src/MeloNX/MeloNX.xcodeproj/project.pbxproj
          perl -0pi -e 's/^\s*4EA2CB242FD924E000BE964F \/\* PBXTargetDependency \*\/,\R//m' "$PROJECT"
          grep -Fq '4EC482D12F8D101B008C1955 /* Ryujinx.Library.dylib */' "$PROJECT"
          ! grep -Fq '4EA2CB242FD924E000BE964F /* PBXTargetDependency */,' "$PROJECT"

      - name: Adapt the official UI to the current iPhone SDK
        run: |
          EMULATION=source/src/MeloNX/MeloNX/UI/Emulation/EmulationView.swift
          APP=source/src/MeloNX/MeloNX/UI/MeloNXApp.swift
          # Swift 6 makes the synthesized initializer private when this stored
          # property is private. The property is otherwise unchanged.
          perl -0pi -e 's/private var air = Air\.shared/var air = Air.shared/' "$EMULATION"
          grep -Fq 'var air = Air.shared' "$EMULATION"
          ! grep -Fq 'private var air = Air.shared' "$EMULATION"
          # The pinned source references an iOS 27 scene-accessory API. macOS-26
          # supplies the current iPhone SDK, which intentionally cannot compile
          # that future-only registration. It does not affect ROM folders or RAM.
          awk '
            /if #available\(iOS 27\.0, \*\) \{/ { skip = 1; next }
            skip && /^        }$/ { skip = 0; next }
            !skip { print }
          ' "$APP" > "$APP.tmp"
          mv "$APP.tmp" "$APP"
          ! grep -Fq 'registerSceneAccessory' "$APP"
          ! grep -Fq 'externalNonInteractive' "$APP"
          # Xcode 26.6's optimizer crashes in the compiler-generated cleanup for
          # this un-subclassed generic settings holder. Marking it final preserves
          # its behavior while avoiding that optimizer defect.
          SETTINGS=source/src/MeloNX/MeloNX/UI/Main/Settings/NativeSettingsManager.swift
          perl -0pi -e 's/class Setting<T: Any>: Hashable, AnySettingProtocol/final class Setting<T: Any>: Hashable, AnySettingProtocol/' "$SETTINGS"
          grep -Fq 'final class Setting<T: Any>' "$SETTINGS"
          # Scope the compiler-pass workaround to MeloNX. Applying it at the
          # xcodebuild command line makes Swift package dependencies inherit it.
          PROJECT=source/src/MeloNX/MeloNX.xcodeproj/project.pbxproj
          perl -0pi -e 's{(4ED5D5182F80DD03007DB057 /\* Release \*/ = \{.*?SWIFT_OBJC_BRIDGING_HEADER = "MeloNX/Core/MeloNX-Bridging-Header\.h";\R)}{$1\t\t\t\tOTHER_SWIFT_FLAGS = "\$(inherited) -Xllvm -sil-disable-pass=early-inline";\n}s' "$PROJECT"
          grep -Fq 'OTHER_SWIFT_FLAGS = "$(inherited) -Xllvm -sil-disable-pass=early-inline";' "$PROJECT"

      - name: Make a device crash report available in Files
        run: |
          CRASH_HANDLER=source/src/MeloNX/MeloNX/Common/Exceptions/ExceptionHandler.swift
          # The upstream handler normally writes its signal record in Caches,
          # which cannot be retrieved from Files. This diagnostic copy keeps
          # the same report but makes it visible in the app's Documents folder.
          perl -0pi -e 's/cachesDirectory/documentDirectory/' "$CRASH_HANDLER"
          perl -0pi -e 's/last_crash/MeloNX-crash/' "$CRASH_HANDLER"
          grep -Fq '.documentDirectory' "$CRASH_HANDLER"
          grep -Fq 'MeloNX-crash.log' "$CRASH_HANDLER"

      - name: Archive the complete official app
        run: |
          xcodebuild archive \
            -project source/src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeloNX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Preserve the memory-entitlement request for personal-team resigning
        run: |
          APP="build/MeloNX.xcarchive/Products/Applications/MeloNX.app"
          ENTITLEMENTS=source/src/MeloNX/MeloNX/MeloNX.entitlements
          # This is an ad-hoc signature only: it carries the source entitlement
          # request into the IPA. The user's sideloading signer replaces it.
          codesign --force --sign - --entitlements "$ENTITLEMENTS" "$APP"
          codesign -d --entitlements :- "$APP" > build/melonx-entitlement-request.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit'             build/melonx-entitlement-request.plist | grep -Fxq true

      - name: Verify memory helper and direct HDD-folder linking
        run: |
          APP="build/MeloNX.xcarchive/Products/Applications/MeloNX.app"
          test -d "$APP"
          test -f "$APP/MeloNX"
          test -d "$APP/PlugIns/MeloNXRamDonor.appex"
          test -f "$APP/PlugIns/MeloNXRamDonor.appex/MeloNXRamDonor"
          test -f "$APP/Frameworks/Ryujinx.Library.dylib"
          test -f source/src/MeloNX/MeloNX/Common/ROMFolders/RomFolderManager.swift
          grep -Fq 'bookmarkData' source/src/MeloNX/MeloNX/Common/ROMFolders/RomFolderManager.swift
          grep -Fq 'resolvingBookmarkData' source/src/MeloNX/MeloNX/Common/ROMFolders/RomFolderManager.swift
          grep -Fq 'startAccessingSecurityScopedResource' source/src/MeloNX/MeloNX/Core/RyujinxController.swift
          grep -Fq 'com.apple.developer.kernel.increased-memory-limit' source/src/MeloNX/MeloNX/MeloNX.entitlements
          git -C source rev-parse HEAD > build/official-source-commit.txt
          {
            printf 'LibHac source: '; git -C libhac rev-parse HEAD
            printf 'Package SHA-256: '; shasum -a 256 "source/local-libhac-feed/$LIBHAC_PACKAGE.$LIBHAC_VERSION.nupkg" | awk '{print $1}'
            printf '%s\n' 'Reconstructed from matching source; this is not asserted byte-identical to the unavailable upstream package.'
          } > build/libhac-source-receipt.txt
          printf '%s\n' "Unsigned for distribution but includes an ad-hoc memory-entitlement request. Apply the capability with iRAM, then re-sign and reinstall the complete IPA (including its embedded helper) with the same personal Apple account." > build/README.txt

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MeloNX.xcarchive/Products/Applications/MeloNX.app build/Payload/
          (
            cd build
            zip -qry MeloNX-official-unsigned.ipa Payload
          )

      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-official-unsigned-ipa
          path: |
            build/MeloNX-official-unsigned.ipa
            build/official-source-commit.txt
            build/libhac-source-receipt.txt
            build/melonx-entitlement-request.plist
            build/README.txt
          if-no-files-found: error
